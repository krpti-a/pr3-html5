<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform Racing 3</title>
<link rel="icon" href="assets/img/favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1d1d1d; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font: 600 15px system-ui, sans-serif; color: #ddd; background: #666; }
  #loading .track { width: 260px; height: 10px; border-radius: 5px; background: #444; overflow: hidden; }
  #bar { width: 0; height: 100%; background: #f8b23b; transition: width .2s; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="loading"><div>Loading Platform Racing 3…</div><div class="track"><div id="bar"></div></div></div>
<script src="errors.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
